plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.streamforge'
version = '1.0.0'

android {
  namespace 'expo.modules.streamforgetorrentdaemon'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation project(":${project.name}\$streamforge-go")
  testImplementation 'junit:junit:4.13.2'
}
