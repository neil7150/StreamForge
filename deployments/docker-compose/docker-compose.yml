services:
  # ─── Databases ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamforge_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [streamforge]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [streamforge]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-streamforge}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-streamforge_minio_password}
    volumes: [minio_data:/data]
    ports: ["9000:9000", "9001:9001"]
    networks: [streamforge]

  # ─── Backend Services ───────────────────────────────────
  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    environment:
      APP_ENV: development
      PORT: "8001"
      DATABASE_URL: postgres://${POSTGRES_USER:-streamforge}:${POSTGRES_PASSWORD:-streamforge_dev_password}@postgres:5432/auth_db?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8001:8001"]
    networks: [streamforge]

  content-service:
    build:
      context: ../../
      dockerfile: services/content/Dockerfile
    environment:
      APP_ENV: development
      PORT: "8002"
      DATABASE_URL: postgres://${POSTGRES_USER:-streamforge}:${POSTGRES_PASSWORD:-streamforge_dev_password}@postgres:5432/content_db?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      AUTH_REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-streamforge}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-streamforge_minio_password}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8002:8002"]
    networks: [streamforge]

  # ─── API Gateway ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports: ["8080:80"]
    depends_on: [auth-service, content-service]
    networks: [streamforge]

  # ─── Monitoring ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [streamforge]

  grafana:
    image: grafana/grafana:latest
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    networks: [streamforge]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  streamforge:
    driver: bridge
