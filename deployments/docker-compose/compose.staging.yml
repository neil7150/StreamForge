# Standalone HTTPS staging stack. Do not combine with the development file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated hexadecimal database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER}
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy
      allkeys-lru
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  auth-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy
      noeviction
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  auth-service:
    build:
      context: ../../
      dockerfile: services/auth/Dockerfile
    environment:
      APP_ENV: production
      PORT: "8001"
      DATABASE_URL: postgres://streamforge:${POSTGRES_PASSWORD:?Set a generated
        hexadecimal database password}@postgres:5432/auth_db?sslmode=disable
      REDIS_URL: redis://auth-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set a generated JWT secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  content-service:
    build:
      context: ../../
      dockerfile: services/content/Dockerfile
    environment:
      APP_ENV: production
      PORT: "8002"
      DATABASE_URL: postgres://streamforge:${POSTGRES_PASSWORD:?Set a generated
        hexadecimal database password}@postgres:5432/content_db?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      AUTH_REDIS_URL: redis://auth-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set a generated JWT secret}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  user-service:
    build:
      context: ../../
      dockerfile: services/user/Dockerfile
    environment:
      APP_ENV: production
      PORT: "8003"
      DATABASE_URL: postgres://streamforge:${POSTGRES_PASSWORD:?Set a generated
        hexadecimal database password}@postgres:5432/user_db?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      AUTH_REDIS_URL: redis://auth-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set a generated JWT secret}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  search-service:
    build:
      context: ../../
      dockerfile: services/search/Dockerfile
    environment:
      APP_ENV: production
      PORT: "8004"
      DATABASE_URL: postgres://streamforge:${POSTGRES_PASSWORD:?Set a generated
        hexadecimal database password}@postgres:5432/content_db?sslmode=disable
      REDIS_URL: redis://redis:6379/3
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      content-service:
        condition: service_healthy
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  nginx:
    image: nginx:alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ../nginx/https.conf:/etc/nginx/conf.d/api.conf:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Set the directory containing fullchain.pem and
          privkey.pem}
        target: /etc/nginx/tls
        read_only: true
    depends_on:
      auth-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
    networks:
      - streamforge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - 443:443
volumes:
  postgres_data: {}
  auth_redis_data: {}
networks:
  streamforge:
    driver: bridge
